<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5 Level Up — lock in</title>
  <meta name="description" content="A minimal pomodoro lock-in space: timer, what's on your mind, and stats with achievements." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body data-world="focus" data-mode="focus">

<div class="glow" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="./" aria-label="5 Level Up">
    <span class="brand-mark">5LU</span>
    <span class="brand-jp" aria-hidden="true">集中</span>
  </a>

  <nav class="worlds" aria-label="Worlds">
    <button class="world-btn" data-go="focus" type="button"><span class="k">01</span>Focus</button>
    <button class="world-btn" data-go="mind" type="button"><span class="k">02</span>Mind</button>
    <button class="world-btn" data-go="stats" type="button"><span class="k">03</span>Stats</button>
    <span class="world-ink" aria-hidden="true"></span>
  </nav>

  <div class="top-right">
    <div class="lv-chip" id="lvChip" title="Level">
      <span class="lv-label">LV</span><strong id="lvNum">1</strong>
      <span class="lv-bar"><span id="lvBar"></span></span>
    </div>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </div>
</header>

<main>

  <!-- ============ 01 FOCUS ============ -->
  <section class="world" id="world-focus" aria-label="Focus">
    <div class="modes" role="tablist" aria-label="Timer mode">
      <button class="mode-btn" data-mode="focus" type="button">Focus</button>
      <button class="mode-btn" data-mode="short" type="button">Short break</button>
      <button class="mode-btn" data-mode="long" type="button">Long break</button>
    </div>

    <div class="dial-wrap">
      <svg class="dial" viewBox="0 0 400 400" aria-hidden="true">
        <g id="ticks"></g>
        <circle class="dial-track" cx="200" cy="200" r="168" />
        <circle class="dial-arc" id="arc" cx="200" cy="200" r="168" />
        <circle class="dial-head" id="head" cx="200" cy="32" r="5" />
      </svg>
      <div class="dial-center">
        <div class="dial-mode" id="dialMode">FOCUS · 集中</div>
        <div class="time" id="time" role="timer" aria-live="off">25:00</div>
        <div class="dial-sub" id="dialSub">Session 1 of 4</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctl" id="resetBtn" type="button" aria-label="Reset (R)" title="Reset · R">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="ctl ctl-main" id="startBtn" type="button" title="Start / pause · Space">
        <span id="startLabel">Start</span>
      </button>
      <button class="ctl" id="skipBtn" type="button" aria-label="Skip (S)" title="Skip · S">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 9 7-9 7z"/><path d="M19 5v14"/></svg>
      </button>
    </div>

    <div class="focus-meta">
      <label class="task-pick">
        <span class="task-pick-k">Working on</span>
        <select id="taskSelect" aria-label="Task for this session"></select>
      </label>

      <div class="goal" title="Today's pomodoros vs daily goal">
        <div class="goal-dots" id="goalDots"></div>
        <span class="goal-txt" id="goalTxt">0 / 8 today</span>
      </div>

      <button class="lock-btn" id="lockBtn" type="button" title="Lock in · L">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Lock in
      </button>
    </div>

    <div class="locked-hud" aria-hidden="true">
      <div class="locked-task" id="lockedTask"></div>
      <button class="unlock-btn" id="unlockBtn" type="button">Esc to unlock</button>
    </div>
  </section>

  <!-- ============ 02 MIND ============ -->
  <section class="world" id="world-mind" aria-label="What's on your mind">
    <div class="mind">
      <div class="mind-head">
        <h1>What's on your mind?</h1>
        <p class="muted">Dump it here. Pick one. Lock in on it.</p>
      </div>

      <form class="capture" id="captureForm" autocomplete="off">
        <span class="capture-plus" aria-hidden="true">+</span>
        <input id="captureInput" type="text" maxlength="160" placeholder="Something to finish…  (press N)" aria-label="New task" />
        <kbd>↵</kbd>
      </form>

      <div class="mind-bar">
        <div class="seg" id="taskFilter">
          <button type="button" data-f="open" class="on">Open <span id="cntOpen">0</span></button>
          <button type="button" data-f="done">Done <span id="cntDone">0</span></button>
        </div>
        <button type="button" class="link-btn" id="clearDone">Clear done</button>
      </div>

      <ul class="tasks" id="taskList"></ul>
      <div class="empty" id="taskEmpty"></div>
    </div>
  </section>

  <!-- ============ 03 STATS ============ -->
  <section class="world" id="world-stats" aria-label="Stats">
    <div class="stats">
      <div class="stats-top">
        <div class="seg" id="rangeSeg">
          <button type="button" data-r="day" class="on">Day</button>
          <button type="button" data-r="week">Week</button>
        </div>
        <div class="range-nav">
          <button class="icon-btn sm" id="prevRange" type="button" aria-label="Previous">‹</button>
          <span id="rangeLabel">Today</span>
          <button class="icon-btn sm" id="nextRange" type="button" aria-label="Next">›</button>
        </div>
      </div>

      <div class="card hero-card">
        <div class="hero-k" id="heroK">Focus time</div>
        <div class="hero-v" id="heroV">0m</div>
        <div class="hero-d" id="heroD"></div>

        <div class="chart" id="chart">
          <div class="chart-plot" id="chartPlot"></div>
          <div class="chart-x" id="chartX"></div>
          <div class="chart-tip" id="chartTip" role="status"></div>
        </div>
      </div>

      <div class="tiles" id="tiles"></div>

      <div class="card">
        <div class="card-h">
          <h2>Most focused on</h2>
          <span class="muted sm" id="mostSub"></span>
        </div>
        <ul class="usage" id="usage"></ul>
      </div>

      <div class="card">
        <div class="card-h">
          <h2>Achievements <span class="jp">実績</span></h2>
          <span class="muted sm" id="achSub">0 / 0</span>
        </div>
        <div class="ach-grid" id="achGrid"></div>
      </div>
    </div>
  </section>
</main>

<footer class="keys" aria-hidden="true">
  <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> worlds</span>
  <span><kbd>Space</kbd> start/pause</span>
  <span><kbd>R</kbd> reset</span>
  <span><kbd>S</kbd> skip</span>
  <span><kbd>L</kbd> lock in</span>
  <span><kbd>N</kbd> new task</span>
</footer>

<!-- Settings -->
<dialog class="sheet" id="settings">
  <form method="dialog" class="sheet-in" id="settingsForm">
    <div class="sheet-h">
      <h2>Settings</h2>
      <button class="icon-btn" value="close" aria-label="Close">✕</button>
    </div>

    <div class="field-row">
      <label>Focus <span><input type="number" name="focus" min="1" max="180" /> min</span></label>
      <label>Short break <span><input type="number" name="short" min="1" max="60" /> min</span></label>
      <label>Long break <span><input type="number" name="long" min="1" max="90" /> min</span></label>
    </div>
    <div class="field-row">
      <label>Long break every <span><input type="number" name="every" min="2" max="12" /> sessions</span></label>
      <label>Daily goal <span><input type="number" name="goal" min="1" max="24" /> pomodoros</span></label>
    </div>

    <label class="toggle"><input type="checkbox" name="autoBreak" /> <span>Auto-start breaks</span></label>
    <label class="toggle"><input type="checkbox" name="autoFocus" /> <span>Auto-start focus after a break</span></label>
    <label class="toggle"><input type="checkbox" name="sound" /> <span>Chime when a session ends</span></label>
    <label class="toggle"><input type="checkbox" name="notify" /> <span>Desktop notification when a session ends</span></label>

    <div class="sheet-foot">
      <button type="button" class="link-btn" id="exportBtn">Export data</button>
      <label class="link-btn">Import<input type="file" id="importInput" accept="application/json" hidden /></label>
      <button type="button" class="link-btn danger" id="wipeBtn">Reset everything</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="./app.js"></script>
</body>
</html>
